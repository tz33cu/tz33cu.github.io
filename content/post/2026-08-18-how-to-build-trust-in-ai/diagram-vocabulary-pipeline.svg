<svg viewBox="-45 0 1245 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where trust-building mechanisms act in an agentic loop</title>
  <desc id="desc">A human sets the judgment boundary. Grounding enters the center of the context node, alignment enters the model node, and guardrails enter the policy and approval gate. The agent loop runs from context through a model, proposed step, approval gate, tool, and observation. Orthogonal feedback returns observations to the next context. Model explanations and observations feed an evidence trace that returns to the human.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59636e"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#276fbf"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#17212b" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="-45" width="1245" height="720" fill="#fcfcfb"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#17212b">Where each mechanism acts in an agentic loop</text>
  <text x="600" y="63" text-anchor="middle" font-size="17" fill="#59636e">Every arrow enters or leaves at the center of a node edge</text>

  <rect x="200" y="90" width="970" height="550" rx="22" fill="#f8f9fa" stroke="#7a858f" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="224" y="76" width="176" height="30" rx="15" fill="#59636e"/>
  <text x="312" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" letter-spacing="0.7">AGENT HARNESS</text>
  <text x="1140" y="112" text-anchor="end" font-size="15" fill="#59636e">coordinates state, tools, permissions, retries, and stopping</text>

  <rect x="-35" y="195" width="180" height="180" rx="16" fill="#eaf2fb" stroke="#276fbf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="55" cy="228" r="17" fill="#276fbf" fill-opacity="0.13" stroke="#276fbf" stroke-width="1.5"/>
  <path d="M47 228l5 5 11-13" fill="none" stroke="#276fbf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="263" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Human judgment</text>
  <text x="55" y="288" text-anchor="middle" font-size="14.5" fill="#48525d">defines the task,</text>
  <text x="55" y="307" text-anchor="middle" font-size="14.5" fill="#48525d">authority, and approvals</text>
  <text x="55" y="335" text-anchor="middle" font-size="14.5" font-weight="700" fill="#276fbf">reviews the evidence</text>
  <text x="55" y="354" text-anchor="middle" font-size="14.5" font-weight="700" fill="#276fbf">and owns the decision</text>

  <rect x="235" y="132" width="160" height="48" rx="10" fill="#fff3ef" stroke="#e76f51" stroke-width="1.5"/>
  <text x="315" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#a33f29">GROUNDING</text>
  <text x="315" y="168" text-anchor="middle" font-size="13.5" fill="#7a4437">adds external evidence</text>
  <rect x="445" y="132" width="160" height="48" rx="10" fill="#f4f1ff" stroke="#6f5bd3" stroke-width="1.5"/>
  <text x="525" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#5543b6">ALIGNMENT</text>
  <text x="525" y="168" text-anchor="middle" font-size="13.5" fill="#504878">shapes model behavior</text>
  <rect x="815" y="132" width="170" height="48" rx="10" fill="#fff8e8" stroke="#c68b15" stroke-width="1.5"/>
  <text x="900" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#8d5d08">GUARDRAILS</text>
  <text x="900" y="168" text-anchor="middle" font-size="13.5" fill="#705524">enforce runtime policies</text>

  <rect x="240" y="240" width="150" height="90" rx="13" fill="#fff8f5" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Context C</text>
  <text x="315" y="293" text-anchor="middle" font-size="15" fill="#59636e">instructions, history,</text>
  <text x="315" y="312" text-anchor="middle" font-size="15" fill="#59636e">retrieved evidence</text>
  <rect x="450" y="240" width="150" height="90" rx="45" fill="#f4f1ff" stroke="#6f5bd3" stroke-width="2" filter="url(#shadow)"/>
  <text x="525" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Model call</text>
  <text x="525" y="298" text-anchor="middle" font-size="15" fill="#5543b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Pθ(next | C)</text>
  <rect x="660" y="240" width="150" height="90" rx="13" fill="#f2faf7" stroke="#2f9d78" stroke-width="2" filter="url(#shadow)"/>
  <text x="735" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Proposed step</text>
  <text x="735" y="293" text-anchor="middle" font-size="15" fill="#59636e">answer, tool call,</text>
  <text x="735" y="312" text-anchor="middle" font-size="15" fill="#59636e">or next action</text>
  <path d="M900 225L960 285 900 345 840 285Z" fill="#fffaf0" stroke="#c68b15" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#17212b">Policy and</text>
  <text x="900" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#17212b">approval gate</text>
  <rect x="1000" y="240" width="150" height="90" rx="13" fill="#f2faf7" stroke="#2f9d78" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075" y="271" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Tool or action</text>
  <text x="1075" y="296" text-anchor="middle" font-size="14" fill="#59636e">read, calculate, write</text>

  <path d="M145 285H236" fill="none" stroke="#276fbf" stroke-width="2.4" marker-end="url(#blueArrow)"/>
  <text x="190" y="253" text-anchor="middle" font-size="14" font-weight="600" fill="#276fbf">task +</text>
  <text x="190" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#276fbf">boundary</text>
  <path d="M390 285H446" fill="none" stroke="#59636e" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M600 285H656" fill="none" stroke="#59636e" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M810 285H836" fill="none" stroke="#59636e" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M960 285H1006" fill="none" stroke="#59636e" stroke-width="2.2" marker-end="url(#arrow)"/>

  <path d="M315 180V236" fill="none" stroke="#e76f51" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M525 180V236" fill="none" stroke="#6f5bd3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M900 180V221" fill="none" stroke="#c68b15" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="980" y="395" width="190" height="74" rx="13" fill="#f2faf7" stroke="#2f9d78" stroke-width="2"/>
  <text x="1075" y="423" text-anchor="middle" font-size="17" font-weight="700" fill="#17212b">Observation</text>
  <text x="1075" y="447" text-anchor="middle" font-size="15" fill="#59636e">result, error, or evidence</text>
  <path d="M1075 330V391" fill="none" stroke="#59636e" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M980 432H970V360H315V334" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="630" y="352" text-anchor="middle" font-size="14.5" fill="#59636e">observation feeds the next context</text>

  <rect x="635" y="395" width="200" height="74" rx="13" fill="#f4f1ff" stroke="#6f5bd3" stroke-width="1.7"/>
  <text x="735" y="422" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5543b6">MODEL EXPLANATION</text>
  <text x="735" y="446" text-anchor="middle" font-size="14.5" fill="#504878">a generated artifact to verify</text>
  <path d="M735 330V391" fill="none" stroke="#6f5bd3" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <rect x="520" y="535" width="620" height="70" rx="13" fill="#eef4fa" stroke="#7aa7d5" stroke-width="1.6"/>
  <text x="545" y="560" font-size="15" font-weight="700" fill="#276fbf" letter-spacing="0.6">EVIDENCE TRACE</text>
  <circle cx="565" cy="582" r="4" fill="#276fbf"/><text x="578" y="588" font-size="15" fill="#33404c">sources</text>
  <circle cx="690" cy="582" r="4" fill="#276fbf"/><text x="703" y="588" font-size="15" fill="#33404c">tool outputs</text>
  <circle cx="845" cy="582" r="4" fill="#276fbf"/><text x="858" y="588" font-size="15" fill="#33404c">calculations</text>
  <circle cx="1000" cy="582" r="4" fill="#276fbf"/><text x="1013" y="588" font-size="15" fill="#33404c">approvals</text>
  <path d="M735 469V531" fill="none" stroke="#6f5bd3" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M1075 469V531" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520 570H55V379" fill="none" stroke="#276fbf" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <text x="305" y="559" text-anchor="middle" font-size="14.5" font-weight="600" fill="#276fbf">inspectable evidence returns to the human</text>
</svg>
